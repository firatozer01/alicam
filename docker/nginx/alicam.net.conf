server {
    listen 80;
    listen [::]:80;
    server_name alicam.net www.alicam.net;

    return 301 https://alicam.net$request_uri;
}

server {
    listen 443 ssl;
    server_name www.alicam.net;

    ssl_certificate /etc/letsencrypt/live/alicam.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alicam.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://alicam.net$request_uri;
}

server {
    listen 443 ssl;
    server_name alicam.net;

    ssl_certificate /etc/letsencrypt/live/alicam.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alicam.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # WebSocket (Laravel Reverb). Tarayici wss://alicam.net/app/... acar;
    # TLS burada sonlanir, baglanti Reverb konteynerine tasinir. Konteyner
    # host'a yalnizca 127.0.0.1:8092 uzerinden aciktir; "reverb" adi burada
    # cozulemez cunku bu nginx compose aginin disinda calisir.
    location /app/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sohbet baglantisi uzun sure sessiz kalabilir; asagidaki 90 saniye
        # onu koparirdi. Reverb dakikada bir ping atar.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }
}
